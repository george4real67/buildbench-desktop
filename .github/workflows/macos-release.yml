name: Build macOS installer
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-installer
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run test:security
      - name: Build universal Mac installer
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --config src-tauri/unsigned-release.json
      - name: Verify app and prepare updater archive
        shell: bash
        run: |
          set -euo pipefail
          app='src-tauri/target/universal-apple-darwin/release/bundle/macos/BuildBench.app'
          codesign --verify --deep --strict "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          hdiutil verify "src-tauri/target/universal-apple-darwin/release/bundle/dmg/BuildBench_${version}_universal.dmg"
          COPYFILE_DISABLE=1 tar -czf "src-tauri/target/universal-apple-darwin/release/bundle/macos/BuildBench.app.tar.gz" -C "$(dirname "$app")" BuildBench.app
      - name: Preserve installers for local signing and publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BuildBench-macOS-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/BuildBench.app.tar.gz
          if-no-files-found: error
